# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom's Gradle plugin requires JVM 21+ to run (the compiled mod itself still
# targets Java 17 via build.gradle's --release flag). Pin the build tool to the
# JDK 21 install found on this machine so a stray JAVA_HOME=jdk-17 doesn't break it.
org.gradle.java.home=C:/Program Files/Java/jdk-21

