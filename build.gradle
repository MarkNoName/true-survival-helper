plugins {
	// This Loom version splits into "fabric-loom" (no-remap, for newer unobfuscated
	// Minecraft builds) and "fabric-loom-remap" (the classic obfuscated workflow) -
	// 1.20.1 needs the latter.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	flatDir {
		dirs 'libs'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// ToughAsNails, Biome Makeover and VanillaBackport are all developed against
	// official Mojang mappings (confirmed from their own source), so this project
	// uses the same mapping set - our Mixin source reads exactly like theirs, and
	// it sidesteps a Yarn/layered-mappings DSL incompatibility with this Loom version.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Compile-time only: the exact jars installed in the True Survival modpack.
	// These are never bundled into our jar and never required at runtime by
	// fabric.mod.json (they are declared as optional "recommends" instead),
	// so True Survival Helper degrades gracefully if one of them is removed.
	modCompileOnly files('libs/levelz-true-survival-1.4.13.jar')
	modCompileOnly files('libs/ToughAsNails-fabric-1.20.1-9.2.0.171.jar')
	modCompileOnly files('libs/biomemakeover-FABRIC-1.20.1-1.11.4.jar')
	modCompileOnly files('libs/VanillaBackport-fabric-1.20.1-1.2.0.2636.1.jar')
	modCompileOnly files('libs/spartan-kick-1.0.3.jar')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
